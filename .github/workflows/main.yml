name: Build ClavierSimple IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fix paths and Generate Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: ClavierSimple
          options:
            bundleIdPrefix: com.claviersimple
            deploymentTarget:
              iOS: "15.0"
          targets:
            ClavierSimple:
              type: application
              platform: iOS
              sources:
                - path: ClavierSimple
                  excludes:
                    - ClavierAZERTY/**
                    - project.yml
              settings:
                base:
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
                  CODE_SIGNING_ALLOWED: NO
              dependencies:
                - target: ClavierAZERTY
            ClavierAZERTY:
              type: app-extension
              platform: iOS
              sources:
                - path: ClavierSimple/ClavierAZERTY
                  excludes:
                    - .github/**
                    - project.yml
              info:
                path: ClavierSimple/ClavierAZERTY/Info.plist
                properties:
                  CFBundleDisplayName: ClavierAZERTY
                  NSExtension:
                    NSExtensionAttributes:
                      IsASCIICapable: false
                      PrefersRightToLeft: false
                      PrimaryLanguage: fr-FR
                      RequestsOpenAccess: false
                    NSExtensionPointIdentifier: com.apple.keyboard-service
                    NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
              settings:
                base:
                  CODE_SIGNING_ALLOWED: NO
          EOF
          xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project ClavierSimple.xcodeproj \
            -scheme ClavierSimple \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ClavierSimple.app Payload/
          zip -r ClavierSimple.ipa Payload

      - name: Upload ClavierSimple.ipa
        uses: actions/upload-artifact@v4
        with:
          name: ClavierSimple-IPA
          path: ClavierSimple.ipa
