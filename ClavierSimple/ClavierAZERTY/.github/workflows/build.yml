name: Build ClavierSimple IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project ClavierSimple.xcodeproj \
            -scheme ClavierSimple \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ClavierSimple.app Payload/
          zip -r ClavierSimple.ipa Payload

      - name: Upload ClavierSimple.ipa
        uses: actions/upload-artifact@v4
        with:
          name: ClavierSimple-IPA
          path: ClavierSimple.ipa
